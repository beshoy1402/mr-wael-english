argin-top:12px}.modal-actions>*{flex:1}.toast{position:fixed;bottom:20px;right:20px;background:#182b25;color:#a8edc3;padding:13px 17px;border-radius:10px;z-index:40}@media(max-width:760px){.side{position:fixed;z-index:30;inset:0 auto 0 0;width:min(300px,85vw);height:100dvh;transform:translateX(-105%);transition:.2s;box-shadow:15px 0 45px #1113}.side.open{transform:translateX(0)}.overlay{position:fixed;inset:0;background:#111a2c80;z-index:29;display:none}.overlay.show{display:block}.menu{display:inline-grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);background:var(--card);border-radius:11px;font-size:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}main{padding:17px 13px 40px}.top{margin-bottom:20px}h1{font-size:21px}.welcome{font-size:21px}.toolbar .field{width:100%}.table-wrap table{min-width:680px}}@media print{@page{size:landscape;margin:12mm}body{background:white}.side,.top,.no-print,.btn,.toolbar{display:none!important}main{padding:0;max-width:none}body *{visibility:hidden}#weekly-print-area,#weekly-print-area *{visibility:visible}#weekly-print-area{position:absolute;left:0;top:0;width:100%}#weekly-print-area .panel{border:0;padding:0;margin:0;box-shadow:none}#weekly-print-area .table-wrap{overflow:visible;border:0;box-shadow:none;margin:8px 0 18px}#weekly-print-area table{width:100%;white-space:normal;font-size:9px;border-collapse:collapse}#weekly-print-area th,#weekly-print-area td{padding:6px;border:1px solid #bbb}#weekly-print-area h2{font-size:17px}#weekly-print-area .print-meta{display:block!important}}
</style></head><body><div class="overlay" id="overlay"></div><div class="layout"><aside class="side" id="side"><div class="brand">WAEL<span>.</span> ENGLISH</div><div class="sub">TEACHER GRADEBOOK</div><div class="nav-label">WORKSPACE</div><button class="nav active" data-page="dashboard">▦ &nbsp; Dashboard</button><button class="nav" data-page="classes">▣ &nbsp; My Classes</button><button class="nav" data-page="students">♙ &nbsp; Students</button><div class="nav-label">ASSESSMENT</div><button class="nav" data-page="participation">✦ &nbsp; Participation</button><button class="nav" data-page="attendance">◷ &nbsp; Attendance</button><button class="nav" data-page="homework">▤ &nbsp; Homework</button><button class="nav" data-page="reports">▥ &nbsp; Reports & Averages</button><div class="nav-label">MANAGEMENT</div><button class="nav" data-page="history">↶ &nbsp; Activity History</button><button class="nav" data-page="settings">⚙ &nbsp; Settings</button><div class="side-foot">Mr Wael · English<br>Local demo storage<br>Firebase can be connected later.</div></aside><main><header class="top"><div class="top-left"><button class="menu" id="menu" aria-label="Open menu">☰</button><div><div class="crumb">MR WAEL / ENGLISH</div><h1 id="title">Dashboard</h1></div></div><div class="toolbar no-print"><button class="btn outline" id="export-all">Export Excel</button><button class="btn outline" id="print">PDF / Print</button></div></header><div id="content"></div></main></div><div class="modal-bg hidden" id="modal-bg"><div class="modal" id="modal"></div></div><div class="toast hidden" id="toast"></div>
<script>
(function(){'use strict';
const CLASSES=[['G12A','English'],['G12B','English'],['G12C','English'],['G12D','English']],KEY='waelEnglishGradebookV1';let data=load(),page='dashboard',activeClass='G12A',filterDate=today();
function today(){return new Date().toLocaleDateString('en-CA')}function load(){try{return JSON.parse(localStorage.getItem(KEY))||{students:[],marks:[]}}catch(e){return{students:[],marks:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function el(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(s){el('toast').textContent=s;el('toast').classList.remove('hidden');setTimeout(()=>el('toast').classList.add('hidden'),2400)}function members(cls){return data.students.filter(s=>s.cls===cls).sort((a,b)=>a.name.localeCompare(b.name))}function records(id,cat){return data.marks.filter(m=>m.studentId===id&&m.category===cat)}function average(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}function studentStats(s){let p=records(s.id,'participation').map(x=>Number(x.score)),a=records(s.id,'attendance').map(x=>x.status==='Present'?100:x.status==='Late'?50:0),h=records(s.id,'homework').map(x=>x.status==='Completed'?100:x.status==='Late'?50:0),pa=average(p),aa=average(a),ha=average(h),v=[pa,aa,ha].filter(x=>x!==null);return{p:pa,a:aa,h:ha,overall:average(v)}}function fmt(v){return v===null?'—':v.toFixed(1)+'%'}
function classCards(){return '<div class="grid">'+CLASSES.map(c=>'<button class="class-card" data-class="'+c[0]+'"><span class="tag">'+c[0]+'</span><h2>'+c[0]+'</h2><div class="muted">'+c[1]+' · '+members(c[0]).length+' students</div><p class="small" style="color:var(--accent);font-weight:800">Open class →</p></button>').join('')+'</div>'}
function stats(){let all=data.students.map(studentStats),av=average(all.map(x=>x.overall).filter(x=>x!==null));return '<div class="stats"><div class="stat"><label>Total students</label><strong>'+data.students.length+'</strong></div><div class="stat"><label>Classes</label><strong>4</strong></div><div class="stat"><label>Daily records</label><strong>'+data.marks.length+'</strong></div><div class="stat"><label>Overall average</label><strong>'+(av===null?'—':av.toFixed(1)+'%')+'</strong></div></div>'}
function studentTable(list){if(!list.length)return '<div class="empty">No students yet. Add your first student.</div>';return '<div class="table-wrap"><table><thead><tr><th>STUDENT</th><th>CLASS</th><th>PARTICIPATION</th><th>ATTENDANCE</th><th>HOMEWORK</th><th>OVERALL AVG.</th><th></th></tr></thead><tbody>'+list.map(s=>{let x=studentStats(s);return '<tr><td><b>'+esc(s.name)+'</b></td><td>'+s.cls+'</td><td>'+fmt(x.p)+'</td><td>'+fmt(x.a)+'</td><td>'+fmt(x.h)+'</td><td class="score">'+fmt(x.overall)+'</td><td><button class="chip up" data-mark="'+s.id+'">Add daily marks</button></td></tr>'}).join('')+'</tbody></table></div>'}
function showModal(s){el('modal').innerHTML=s;el('modal-bg').classList.remove('hidden');el('modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){el('modal-bg').classList.add('hidden')}
function addStudent(){showModal('<h2>Add student</h2><label class="small">Student full name</label><input class="field" id="new-name" placeholder="Student name"><label class="small">Class</label><select class="field" id="new-class">'+CLASSES.map(c=>'<option>'+c[0]+'</option>').join('')+'</select><div class="modal-actions"><button class="btn outline" data-close>Cancel</button><button class="btn primary" id="save-student">Save student</button></div>');el('save-student').onclick=()=>{let name=el('new-name').value.trim(),cls=el('new-class').value;if(!name){notify('Enter a student name');return}if(data.students.some(s=>s.cls===cls&&s.name.toLowerCase()===name.toLowerCase())){notify('Student already exists in this class');return}data.students.push({id:Date.now()+Math.random(),name:name,cls:cls});save();closeModal();render();notify('Student added')}}
function markModal(id){let s=data.students.find(x=>String(x.id)===String(id));if(!s)return;showModal('<h2>Daily marks · '+esc(s.name)+'</h2><label class="small">Date</label><input id="mark-date" class="field" type="date" value="'+filterDate+'"><label class="small">Participation score (0–100)</label><input id="part-score" class="field" type="number" min="0" max="100" step="1" placeholder="e.g. 85"><label class="small">Attendance</label><select id="att-status" class="field"><option>Present</option><option>Late</option><option>Absent</option></select><label class="small">Homework</label><select id="hw-status" class="field"><option>Completed</option><option>Late</option><option>Missing</option></select><p class="small muted">Attendance and homework are converted to percentage scores: Present/Completed = 100, Late = 50, Absent/Missing = 0.</p><div class="modal-actions"><button class="btn outline" data-close>Cancel</button><button class="btn primary" id="save-marks">Save daily record</button></div>');el('save-marks').onclick=()=>{let date=el('mark-date').value,raw=el('part-score').value;if(!date){notify('Choose a date');return}if(raw!==''&&(Number(raw)<0||Number(raw)>100)){notify('Participation must be from 0 to 100');return}let vals=[{category:'participation',score:raw===''?null:Number(raw)},{category:'attendance',status:el('att-status').value},{category:'homework',status:el('hw-status').value}];vals.forEach(v=>{if(v.score===null)return;let idx=data.marks.findIndex(m=>m.studentId===s.id&&m.date===date&&m.category===v.category),rec=Object.assign({studentId:s.id,cls:s.cls,date:date},v);if(idx>=0)data.marks[idx]=rec;else data.marks.push(rec)});save();closeModal();render();notify('Daily record saved')}}
function dailyView(cat){let list=members(activeClass),label=cat[0].toUpperCase()+cat.slice(1);return '<div class="panel"><div class="toolbar"><select class="field" id="class-filter">'+CLASSES.map(c=>'<option '+(c[0]===activeClass?'selected':'')+'>'+c[0]+'</option>').join('')+'</select><input class="field" type="date" id="date-filter" value="'+filterDate+'"></div><p class="muted small">Select a date, then record '+label.toLowerCase()+' for each student.</p>'+list.map(s=>{let r=data.marks.find(m=>m.studentId===s.id&&m.date===filterDate&&m.category===cat),val=cat==='participation'?(r?r.score+'/100':'Not recorded'):(r?r.status:'Not recorded');return '<div class="section" style="border-top:1px solid var(--line);padding-top:12px"><div><b>'+esc(s.name)+'</b><div class="small muted">'+val+'</div></div><button class="btn secondary" data-mark="'+s.id+'">Edit daily record</button></div>'}).join('')+'</div>'}
function downloadCsv(cls){let list=cls==='ALL'?data.students:members(cls),rows=[['Student','Class','Participation Average (%)','Attendance Average (%)','Homework Average (%)','Overall Average (%)']];list.forEach(s=>{let x=studentStats(s);rows.push([s.name,s.cls,x.p===null?'':x.p.toFixed(2),x.a===null?'':x.a.toFixed(2),x.h===null?'':x.h.toFixed(2),x.overall===null?'':x.overall.toFixed(2)])});let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Mr-Wael-English-Report-'+cls+'.csv';a.click();URL.revokeObjectURL(a.href)}
function weekDates(value){let d=new Date(value+'T12:00:00');let day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);return x.toLocaleDateString('en-CA')})}
function weeklyValues(s,dates){let rows=dates.map(date=>{let p=data.marks.find(m=>m.studentId===s.id&&m.date===date&&m.category==='participation'),a=data.marks.find(m=>m.studentId===s.id&&m.date===date&&m.category==='attendance'),h=data.marks.find(m=>m.studentId===s.id&&m.date===date&&m.category==='homework');return{date,p:p&&p.score!==null?p.score:null,a:a?(a.status==='Present'?100:a.status==='Late'?50:0):null,as:a?a.status:'—',h:h?(h.status==='Completed'?100:h.status==='Late'?50:0):null,hs:h?h.status:'—'}});let pa=average(rows.map(x=>x.p).filter(x=>x!==null)),aa=average(rows.map(x=>x.a).filter(x=>x!==null)),ha=average(rows.map(x=>x.h).filter(x=>x!==null)),overall=average([pa,aa,ha].filter(x=>x!==null));return{rows,pa,aa,ha,overall}}
function downloadWeeklyCsv(cls,week){let dates=weekDates(week),list=cls==='ALL'?data.students:members(cls),rows=[['Student','Class','Date','Participation','Attendance','Homework'],...list.flatMap(s=>weeklyValues(s,dates).rows.map(r=>[s.name,s.cls,r.date,r.p===null?'':r.p,r.as,r.hs])),[],['WEEKLY AVERAGES'],['Student','Class','Participation Average (%)','Attendance Average (%)','Homework Average (%)','Overall Weekly Average (%)'],...list.map(s=>{let x=weeklyValues(s,dates);return[s.name,s.cls,x.pa===null?'':x.pa.toFixed(2),x.aa===null?'':x.aa.toFixed(2),x.ha===null?'':x.ha.toFixed(2),x.overall===null?'':x.overall.toFixed(2)]})],csv=rows.map(r=>r.map(v=>'"'+String(v===undefined?'':v).replace(/"/g,'""')+'"').join(',')).join('\\r\\n'),blob=new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Mr-Wael-Weekly-Report-'+cls+'-'+dates[0]+'.csv';a.click();URL.revokeObjectURL(a.href)}
function reports(){let list=activeClass==='ALL'?data.students.slice().sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name)):members(activeClass);let dates=weekDates(filterDate),start=dates[0],end=dates[6],fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'}),detail=list.map(s=>{let x=weeklyValues(s,dates);return x.rows.map(r=>'<tr><td><b>'+esc(s.name)+'</b><br><span class="muted small">'+s.cls+'</span></td><td>'+fmtDate(r.date)+'</td><td>'+(r.p===null?'—':r.p+'/100')+'</td><td>'+esc(r.as)+'</td><td>'+esc(r.hs)+'</td></tr>').join('')}).join(''),summary=list.map(s=>{let x=weeklyValues(s,dates);return '<tr><td><b>'+esc(s.name)+'</b></td><td>'+s.cls+'</td><td>'+fmt(x.pa)+'</td><td>'+fmt(x.aa)+'</td><td>'+fmt(x.ha)+'</td><td class="score">'+fmt(x.overall)+'</td></tr>'}).join('');return '<div class="panel"><div class="toolbar no-print"><select class="field" id="report-class"><option value="ALL" '+(activeClass==='ALL'?'selected':'')+'>All classes</option>'+CLASSES.map(c=>'<option value="'+c[0]+'" '+(c[0]===activeClass?'selected':'')+'>'+c[0]+'</option>').join('')+'</select><label class="small muted">Choose any date in the week</label><input class="field" type="date" id="report-week" value="'+filterDate+'"><button class="btn outline" id="report-csv">Download Excel (CSV)</button><button class="btn primary" id="report-pdf">Print weekly PDF</button></div><div id="weekly-print-area"><div class="print-meta" style="display:none"><h2>Mr Wael · English — Weekly Class Report</h2></div><h2>Weekly report · '+(activeClass==='ALL'?'All classes':activeClass)+'</h2><p class="muted small">Week: '+fmtDate(start)+' – '+fmtDate(end)+' · Participation is shown as /100. Attendance: Present=100, Late=50, Absent=0. Homework: Completed=100, Late=50, Missing=0.</p><h3>Daily records</h3><div class="table-wrap"><table><thead><tr><th>STUDENT</th><th>DATE</th><th>PARTICIPATION</th><th>ATTENDANCE</th><th>HOMEWORK</th></tr></thead><tbody>'+(detail||'<tr><td colspan="5">No students in this class.</td></tr>')+'</tbody></table></div><h3>Weekly averages — final student summary</h3><div class="table-wrap"><table><thead><tr><th>STUDENT</th><th>CLASS</th><th>PARTICIPATION AVG.</th><th>ATTENDANCE AVG.</th><th>HOMEWORK AVG.</th><th>OVERALL WEEKLY AVG.</th></tr></thead><tbody>'+(summary||'<tr><td colspan="6">No students in this class.</td></tr>')+'</tbody></table></div><p class="small muted">Each category average includes only records entered during this week. The overall weekly average is the mean of the available category averages; categories with no entries are excluded.</p></div></div>'}
function render(){let c='',title='Dashboard';if(page==='dashboard'){title='Dashboard';c='<div class="welcome">Welcome, Mr Wael 👋</div><p class="muted">Your English grading workspace.</p>'+stats()+'<div class="section"><h2>Your classes</h2><span class="muted small">Academic year 2026–2027</span></div>'+classCards()}else if(page==='classes'){title='My Classes';c='<div class="section"><h2>Select a class</h2><button class="btn primary" id="add-student">+ Add student</button></div>'+classCards()}else if(page==='students'){title='Students';c='<div class="section"><div><h2>All students</h2><p class="muted small">Manage class lists and daily records.</p></div><button class="btn primary" id="add-student">+ Add student</button></div>'+studentTable(data.students)}else if(page==='class'){title=activeClass;c='<div class="section"><div><h2>'+activeClass+' · English</h2><p class="muted small">'+members(activeClass).length+' students</p></div><button class="btn primary" id="add-student">+ Add student</button></div>'+studentTable(members(activeClass))}else if(['participation','attendance','homework'].includes(page)){title=page[0].toUpperCase()+page.slice(1);c='<div class="section"><h2>'+title+' · '+activeClass+'</h2></div>'+dailyView(page)}else if(page==='reports'){title='Reports & Averages';c='<div class="section"><h2>Student performance report</h2></div>'+reports()}else if(page==='history'){title='Activity History';c='<div class="panel"><p class="muted">Recent daily records</p>'+data.marks.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,100).map(m=>{let s=data.students.find(x=>x.id===m.studentId);return '<div class="section" style="border-bottom:1px solid var(--line);padding:10px 0"><div><b>'+esc(s?s.name:'Deleted student')+'</b><div class="small muted">'+m.cls+' · '+m.date+' · '+m.category+'</div></div><b>'+(m.score===undefined?esc(m.status):m.score+'/100')+'</b></div>'}).join('')||'<div class="empty">No records yet.</div>'+'</div>'}else if(page==='settings'){title='Settings';c='<div class="panel"><h2>Grading method</h2><p>Participation is entered as a score from 0 to 100. Attendance and homework statuses are converted to percentages (100 / 50 / 0). Overall average is the arithmetic mean of available category averages.</p><p class="muted small">Data is currently stored in this browser only. It is not synced between devices. Connect Firebase later for cloud sync and teacher authentication.</p><button class="btn danger" id="clear-data">Clear local demo data</button></div>'}el('title').textContent=title;el('content').innerHTML=c;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='class'&&b.dataset.page==='classes')));bind()}
function bind(){let b=el('add-student');if(b)b.onclick=addStudent;document.querySelectorAll('[data-class]').forEach(x=>x.onclick=()=>{activeClass=x.dataset.class;page='class';render()});document.querySelectorAll('[data-mark]').forEach(x=>x.onclick=()=>markModal(x.dataset.mark));let cf=el('class-filter');if(cf)cf.onchange=()=>{activeClass=cf.value;render()};let df=el('date-filter');if(df)df.onchange=()=>{filterDate=df.value;render()};let rc=el('report-class');if(rc)rc.onchange=()=>{activeClass=rc.value;render()};let rw=el('report-week');if(rw)rw.onchange=()=>{filterDate=rw.value||today();render()};let csv=el('report-csv');if(csv)csv.onclick=()=>downloadWeeklyCsv(activeClass,filterDate);let pdf=el('report-pdf');if(pdf)pdf.onclick=()=>window.print();let clear=el('clear-data');if(clear)clear.onclick=()=>{if(confirm('Delete all local demo students and records?')){data={students:[],marks:[]};save();render();notify('Local data cleared')}}}
function bindNav(){document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;el('side').classList.remove('open');el('overlay').classList.remove('show');render()})}
el('menu').onclick=()=>{el('side').classList.toggle('open');el('overlay').classList.toggle('show')};el('overlay').onclick=()=>{el('side').classList.remove('open');el('overlay').classList.remove('show')};el('print').onclick=()=>window.print();el('export-all').onclick=()=>downloadCsv('ALL');el('modal-bg').onclick=e=>{if(e.target===el('modal-bg'))closeModal()};bindNav();render();
})();
</script></body></html>
